# bootcamp-confluent — Tooling Version Lock
#
# This file is the source of truth for tool versions used by .claude/ hooks
# and by local development. Keep in sync with:
#   - pyproject.toml / requirements.txt (Python deps)
#   - terraform versions.tf (if IaC labs use the confluent provider)
#   - CI workflow files (GitHub Actions)
#
# Last reviewed: 2026-07-11

# === Python toolchain ===
python          = "3.11"
ruff            = "0.4.4"      # lint + import sort + format
black           = "24.4.2"     # formatter, --line-length 100
mypy            = "1.10.0"     # strict on library code
pytest          = "8.2.0"
pytest-cov      = "5.0.0"
hypothesis      = "6.100.0"    # property-based tests
testcontainers  = "4.4.0"      # Kafka + Schema Registry fixtures (local fallback tests)

# === Confluent Cloud ===
confluent-cli          = "4.x"      # `confluent` CLI binary — labs assume v4+
confluent-kafka-python = "2.4.0"    # librdkafka wrapper (producers/consumers)
avro                   = "1.11.3"   # Avro schema library
# Schema Registry, Connect, Flink and Tableflow are fully managed on Confluent
# Cloud — no version pin applies; labs track whatever the cloud runs.

# === Infrastructure as Code (optional labs) ===
terraform       = "1.7.5"
provider-conf   = "2.x"        # confluentinc/confluent — environments, clusters, service accounts

# === Source database for CDC labs (modulo-03) ===
postgres               = "16-alpine"   # Docker image; source DB for the managed Debezium connector
psycopg                = "3.1.x"       # seed/simulator scripts

# === Local dev fallback (skills/confluent/local-dev-fallback.md) ===
# Slim stack for offline demos / recording without burning cloud credits.
confluent-local        = "7.6.x"       # confluentinc/cp-kafka (KRaft, single broker) + cp-schema-registry

# === Tooling for hooks ===
# These must be in PATH for .claude/hooks/*.sh to work. Hooks fail-open if
# a tool is missing (except the CHANGELOG guard, which is purely bash+jq+git).
jq              = "1.7"
git             = "2.44"
bash            = "5"

# === How hooks use this file ===
# The hook scripts do NOT read this file directly (they check `command -v` and
# fail open). This file exists to:
#   1. Give contributors a single reference for "which versions were this green"
#   2. Support pre-commit-config.yaml parity when the team adds one
#   3. Anchor the CHANGELOG-worthy moments when we bump a toolchain version
#
# To upgrade a tool: edit this file, bump the pinned version in the consuming
# config (pyproject.toml, versions.tf, CI workflow), run the test suite, and
# log the upgrade in CHANGELOG.md under ### Changed.
